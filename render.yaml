databases:
  - name: komunityDB
    plan: free
    databaseName: komunity
    user: komunity

services:
  - type: web
    name: komunity-web
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /admin/login/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: komunityDB
          property: connectionString
      - key: SECRET
        generateValue: true
      - key: DJANGO_SETTINGS_MODULE
        value: core.deployment
      - key: DJANGO_ENV
        value: production
      - key: RENDER_EXTERNAL_HOSTNAME
        value: komunityweb.onrender.com
      - key: WEB_CONCURRENCY
        value: 2
      - key: EMAIL_HOST_USER
        value: manyadzatocky@gmail.com
      - key: EMAIL_PASSWORD
        sync: false   # Set this manually in the Render dashboard
