databases:
  - name: komunity-db
    plan: free
    databaseName: komunity
    user: komunity

services:
  - type: web
    name: komunity-web
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: python -m gunicorn core.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: komunity-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_SETTINGS_MODULE
        value: core.deployment
      - key: WEB_CONCURRENCY
        value: 4
