{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Error - Komunity</title>
    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full">
        <div class="bg-white rounded-2xl shadow-xl p-8 border border-gray-100 text-center">
            <!-- Error Icon -->
            <div class="flex justify-center mb-6">
                <div class="h-16 w-16 bg-red-50 rounded-2xl flex items-center justify-center text-red-600">
                    <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                    </svg>
                </div>
            </div>

            <!-- Page Titles -->
            <h1 class="text-2xl font-bold text-gray-900 mb-2">
                {% trans "Social Authentication Error" %}
            </h1>
            <p class="text-gray-600 text-sm mb-8 px-2">
                {% trans "An error occurred while attempting to sign in using your social account. Please try again." %}
            </p>

            <!-- Actions -->
            <div class="space-y-3">
                <a href="{% url 'account_login' %}"
                    class="block w-full bg-blue-600 text-white font-semibold py-3 px-4 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-all duration-200 shadow-lg shadow-blue-500/10">
                    {% trans "Back to Sign In" %}
                </a>
                <a href="/"
                    class="block w-full text-gray-500 hover:text-gray-700 font-medium text-sm py-2 transition-colors duration-150">
                    {% trans "Go to Homepage" %}
                </a>
            </div>
        </div>
    </div>
</body>

</html>
