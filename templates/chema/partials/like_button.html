<button hx-post="{% url 'toggle_like' post.id %}" 
        hx-swap="outerHTML"
        class="flex items-center gap-1 px-3 py-1 rounded-full transition-colors {% if request.user.profile in post.likes.all %}text-red-500 bg-red-50{% else %}text-gray-500 hover:bg-gray-100{% endif %}">
    <span class="material-icons" style="font-size: 20px;">
        {% if request.user.profile in post.likes.all %}favorite{% else %}favorite_border{% endif %}
    </span>
    <span class="text-sm font-medium">{{ post.likes.count }}</span>
</button>
