<dialog id="p2p_transfer_modal" class="modal">
  <div class="modal-box bg-white rounded-[2rem] p-8 shadow-2xl border border-gray-100">
    <form method="dialog">
      <button class="btn btn-sm btn-circle btn-ghost absolute right-4 top-4 text-gray-400 hover:text-gray-600 transition-colors">✕</button>
    </form>
    
    <div class="mb-6">
        <div class="w-12 h-12 bg-blue-100 rounded-2xl flex items-center justify-center mb-4">
            <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
            </svg>
        </div>
        <h3 class="font-black text-2xl text-gray-900">Send Money</h3>
        <p class="text-gray-500 font-medium">Transfer funds instantly to another member.</p>
    </div>
    
    <form hx-post="{% url 'wallet_p2p_transfer' %}" hx-swap="afterend" class="space-y-6">
        {% csrf_token %}
        
        <div class="space-y-2">
            <label for="recipient_email" class="block text-sm font-bold text-gray-700 uppercase tracking-wider">Recipient Email</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
                    </svg>
                </div>
                <input type="email" name="recipient_email" id="recipient_email" required 
                       class="block w-full pl-11 pr-4 py-3 bg-gray-50 border-transparent rounded-2xl focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all text-gray-900 font-medium" 
                       placeholder="friend@example.com">
            </div>
        </div>
        
        <div class="space-y-2">
            <label for="p2p_amount" class="block text-sm font-bold text-gray-700 uppercase tracking-wider">Amount</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <span class="text-gray-400 font-bold">R</span>
                </div>
                <input type="number" name="amount" id="p2p_amount" step="0.01" min="0.01" required 
                       class="block w-full pl-11 pr-4 py-3 bg-gray-50 border-transparent rounded-2xl focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all text-gray-900 font-bold text-lg" 
                       placeholder="0.00">
            </div>
        </div>

        <div class="space-y-2">
            <label for="p2p_note" class="block text-sm font-bold text-gray-700 uppercase tracking-wider">Note (Optional)</label>
            <textarea name="note" id="p2p_note" rows="2"
                      class="block w-full px-4 py-3 bg-gray-50 border-transparent rounded-2xl focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all text-gray-900 font-medium resize-none" 
                      placeholder="What is this for?"></textarea>
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-2xl shadow-lg shadow-blue-200 transition-all hover:-translate-y-0.5 active:scale-[0.98] flex items-center justify-center gap-2">
            <span>Send Money Now</span>
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
        </button>
    </form>
  </div>
</dialog>

<script>
    document.body.addEventListener('close-p2p-modal', function(){
        const modal = document.getElementById('p2p_transfer_modal');
        if (modal) modal.close();
    });
</script>
